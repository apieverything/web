name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Integrity check (offline)
        run: node scripts/check.js
      - name: Build static image
        run: docker build -t api-everything-web:ci .
